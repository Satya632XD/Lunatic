<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Terra • Infinite Voxel Sandbox</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071016;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;inset:0;pointer-events:none}
  #crosshair{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);}
  #crosshair:before,#crosshair:after{content:"";position:absolute;background:rgba(255,255,255,.9);box-shadow:0 0 3px #000}
  #crosshair:before{width:2px;height:18px;left:8px;top:0}.#crosshair:after{width:18px;height:2px;left:0;top:8px}
  #crosshair:after{width:18px;height:2px;left:0;top:8px}
  #topbar{position:absolute;left:12px;top:10px;background:rgba(0,0,0,.32);backdrop-filter:blur(8px);padding:7px 10px;border-radius:10px;font-size:12px;line-height:1.3}
  #hotbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);border-radius:12px;backdrop-filter:blur(9px)}
  .slot{width:48px;height:48px;box-sizing:border-box;border:2px solid rgba(255,255,255,.18);border-radius:8px;background:rgba(30,30,30,.58);display:flex;align-items:center;justify-content:center;position:relative;font-size:11px;user-select:none}
  .slot.selected{border-color:#fff;box-shadow:0 0 0 2px rgba(95,220,255,.45)}
  .slot canvas{width:28px;height:28px}
  .slot .count{position:absolute;right:3px;bottom:1px;font-weight:700;text-shadow:0 1px 2px #000}
  .slot .key{position:absolute;left:3px;top:1px;color:#bbb;font-size:9px}
  #hint{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,.78);background:rgba(0,0,0,.28);padding:5px 8px;border-radius:8px;white-space:nowrap}
  #inventoryBtn,#sprintBtn{position:absolute;pointer-events:auto;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.38);color:#fff;border-radius:12px;padding:10px 13px;backdrop-filter:blur(8px);font-weight:700}
  #inventoryBtn{right:12px;top:12px} #sprintBtn{right:12px;top:58px}
  #joystick{position:absolute;left:18px;bottom:22px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);pointer-events:auto;display:none}
  #stick{position:absolute;width:54px;height:54px;border-radius:50%;left:33px;top:33px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25)}
  #inventory{position:fixed;inset:0;background:rgba(0,0,0,.64);backdrop-filter:blur(9px);display:none;align-items:center;justify-content:center;pointer-events:auto}
  #panel{width:min(520px,92vw);background:#161a1d;border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:16px;box-shadow:0 20px 80px rgba(0,0,0,.5)}
  #panel h2{margin:0 0 8px;font-size:18px}.grid{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin-top:10px}.grid .slot{width:auto;height:54px}
  #craft{margin-top:13px;padding:10px;background:#0f1316;border-radius:12px}.recipe{display:flex;align-items:center;justify-content:space-between;gap:8px}.recipe button{background:#2e4146;color:#fff;border:1px solid rgba(255,255,255,.14);padding:8px 10px;border-radius:9px}
  #closeInv{margin-top:12px;width:100%;padding:9px;border-radius:9px;border:0;background:#dfeff3;color:#152126;font-weight:800}
  #toast{position:absolute;left:50%;top:66px;transform:translateX(-50%);padding:7px 10px;border-radius:9px;background:rgba(0,0,0,.55);font-size:12px;opacity:0;transition:opacity .18s}
  @media (pointer:coarse){#joystick{display:block}#hint{display:none}#hotbar{display:none}.slot{width:42px;height:42px}}
</style>
</head>
<body>
<div id="hud">
  <div id="crosshair"></div>
  <div id="topbar">Terra • <span id="status">Loading world…</span></div>
  <div id="hint">WASD move • Shift sprint • Space jump • Hold LMB mine • RMB place • 1–9 select</div>
  <div id="hotbar"></div>
  <button id="inventoryBtn">Inventory</button>
  <button id="sprintBtn">Sprint</button>
  <div id="joystick"><div id="stick"></div></div>
  <div id="toast"></div>
</div>
<div id="inventory">
  <div id="panel">
    <h2>Terra Inventory</h2>
    <div id="invGrid" class="grid"></div>
    <div id="craft"><div class="recipe"><div><b>Iron Bucket</b><br><span style="font-size:12px;color:#aab">5 iron → 1 iron bucket</span></div><button id="craftBucket">Craft</button></div></div>
    <button id="closeInv">Close</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>
<script src="world_generation.js"></script>
<script>
(() => {
'use strict';

if (!window.THREE) {
  document.body.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;background:#071016;color:#fff;font:16px system-ui;padding:24px;box-sizing:border-box;text-align:center"><div><b>Terra could not start.</b><br><span style="opacity:.75">The Three.js CDN did not load. This copy is designed for normal internet-enabled static hosting.</span></div></div>';
  return;
}
const THREE = window.THREE;
const {WORLD_HEIGHT, SEA_LEVEL} = window.TERRA_WORLD_CONSTANTS;
const CHUNK = 16;
const WORLD_SEED_KEY = 'terra_world_v1';
const RENDER_DISTANCE = 4;
const PLAYER = {width:0.6,height:1.8,eye:1.62,step:0.02,gravity:24,jump:8.5,walk:4.3,sprint:6.7};

// ---------------- Block/item registry ----------------
const T = {
  GRASS:0, DIRT:2, STONE:3, SAND:4, WOOD:5, LEAVES:6, CRAFTING_TABLE:7, PLANKS:8,
  SNOW:10, GRAVEL:11, DIAMOND_ORE:12, BEDROCK:13, IRON_ORE:14, WATER:15, COBBLESTONE:16
};
const blocks = {};
function reg(id,name,opts={}) { blocks[id] = {id,name,solid:true,transparent:false,mineable:true,hardness:1,requiredToolTier:0,drops:null,tex:{all:0},...opts}; }
reg(0,'Air',{solid:false,mineable:false,hardness:0});
reg(1,'Grass',{hardness:0.55,drops:'grass',tex:{top:0,side:1,bottom:2}});
reg(2,'Dirt',{hardness:0.55,drops:'dirt',tex:{all:2}});
reg(3,'Stone',{hardness:1.8,requiredToolTier:1,drops:'cobblestone',tex:{all:3}});
reg(4,'Sand',{hardness:0.5,drops:'sand',tex:{all:12}});
reg(5,'Wood',{hardness:1.0,drops:'wood',tex:{top:4,side:5,bottom:5}});
reg(6,'Leaves',{solid:true,transparent:true,hardness:0.3,drops:'leaves',tex:{all:6}});
reg(7,'Crafting Table',{hardness:1.1,drops:'crafting_table',tex:{top:15,side:15,bottom:15}});
reg(8,'Planks',{hardness:1.0,drops:'planks',tex:{all:14}});
reg(10,'Snow',{hardness:0.35,drops:'snow',tex:{all:13}});
reg(11,'Gravel',{hardness:0.9,drops:'gravel',tex:{all:9}});
reg(12,'Diamond Ore',{hardness:3.2,requiredToolTier:3,drops:'diamond',tex:{all:10}});
reg(13,'Bedrock',{solid:true,mineable:false,hardness:Infinity,drops:null,tex:{all:8}});
reg(14,'Iron Ore',{hardness:2.4,requiredToolTier:1,drops:'iron_ore',tex:{all:11}});
reg(15,'Water',{solid:false,transparent:true,mineable:false,hardness:0,drops:null,tex:{all:16}});
reg(16,'Cobblestone',{hardness:2.0,requiredToolTier:1,drops:'cobblestone',tex:{all:7}});

const items = {
  grass:{name:'Grass',stack:64,place:1,color:0x6fa64b}, dirt:{name:'Dirt',stack:64,place:2,color:0x8b5a34}, stone:{name:'Stone',stack:64,place:3,color:0x777777}, sand:{name:'Sand',stack:64,place:4,color:0xd9c38c},
  wood:{name:'Wood',stack:64,place:5,color:0x9a6b3c}, leaves:{name:'Leaves',stack:64,place:6,color:0x4f9139}, crafting_table:{name:'Crafting Table',stack:64,place:7,color:0x8f6037}, planks:{name:'Planks',stack:64,place:8,color:0xc18b52}, snow:{name:'Snow',stack:64,place:10,color:0xe8f2ff}, gravel:{name:'Gravel',stack:64,place:11,color:0x88867f}, cobblestone:{name:'Cobblestone',stack:64,place:16,color:0x65676b}, iron_ore:{name:'Iron Ore',stack:64,color:0xc97f55}, diamond:{name:'Diamond',stack:64,color:0x3bd8e7},
  wood_pickaxe:{name:'Wood Pickaxe',stack:1,toolTier:1,toolType:'pickaxe',color:0x9a6b3c}, stone_pickaxe:{name:'Stone Pickaxe',stack:1,toolTier:2,toolType:'pickaxe',color:0x777777}, iron_pickaxe:{name:'Iron Pickaxe',stack:1,toolTier:3,toolType:'pickaxe',color:0xd0d5d8}, diamond_pickaxe:{name:'Diamond Pickaxe',stack:1,toolTier:4,toolType:'pickaxe',color:0x39dce7}, iron:{name:'Iron',stack:64,color:0xd5dadd}, iron_bucket:{name:'Iron Bucket',stack:1,color:0xd0d5d8}, water_bucket:{name:'Water Bucket',stack:1,color:0x53cde7}, apple:{name:'Apple',stack:16,food:4,color:0xe4574a}
};
const tierNames = {0:'Hand',1:'Wood',2:'Stone',3:'Iron',4:'Diamond'};
const recipes = [{output:'iron_bucket',count:1,inputs:{iron:5}}];

const blockNameToId = {}; Object.values(blocks).forEach(b=>blockNameToId[b.name.toLowerCase()] = b.id);

// ---------------- Texture atlas ----------------
const atlas = new THREE.TextureLoader().load('assets/textures/atlas.png', undefined, undefined, () => buildFallbackAtlas());
atlas.colorSpace = THREE.SRGBColorSpace; atlas.magFilter = THREE.NearestFilter; atlas.minFilter = THREE.NearestFilter; atlas.wrapS = atlas.wrapT = THREE.ClampToEdgeWrapping; atlas.generateMipmaps = false;
function buildFallbackAtlas(){
  const c=document.createElement('canvas'); c.width=80;c.height=64; const ctx=c.getContext('2d');
  const cols=[0x76a94b,0x6a993e,0x845632,0x8a8a8a,0x98663b,0x7e5133,0x4d913b,0x6b6d72,0x17131d,0x8b8882,0x36cfde,0xc17a55,0xd7c18b,0xeaf3fb,0xb88a55,0x7a5435,0x4dc6e6];
  for(let i=0;i<17;i++){ctx.fillStyle='#'+cols[i].toString(16).padStart(6,'0');ctx.fillRect((i%5)*16,Math.floor(i/5)*16,16,16);}
  const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace; tex.magFilter=THREE.NearestFilter; tex.minFilter=THREE.NearestFilter; tex.generateMipmaps=false; atlas.image=c; atlas.needsUpdate=true; toast('Texture atlas missing, using fallback textures');
}

function texTile(tile, face, out){
  const id = typeof tile === 'number' ? tile : (tile[face] ?? tile.all ?? 0);
  const tx = id % 5, ty = Math.floor(id / 5); const u0=tx/5, v0=ty/4, u1=(tx+1)/5, v1=(ty+1)/4;
  out.push(u0,v1,u1,v1,u1,v0,u0,v0);
}

// ---------------- World storage / persistence ----------------
class Persistence {
  constructor(){this.key=WORLD_SEED_KEY; this.data=null; this.timer=0;}
  load(){
    try { const raw=localStorage.getItem(this.key); this.data=raw?JSON.parse(raw):{seed:(Math.random()*0x7fffffff)|0,edits:{}}; }
    catch(e){ this.data={seed:1337,edits:{}}; }
    if(!this.data.edits)this.data.edits={};
    return this.data;
  }
  scheduleSave(){clearTimeout(this.timer); this.timer=setTimeout(()=>this.save(),350);}
  save(){try{localStorage.setItem(this.key,JSON.stringify(this.data));}catch(e){toast('Save storage is full');}}
  chunkEdits(cx,cz){return this.data.edits[`${cx},${cz}`] || (this.data.edits[`${cx},${cz}`]={});}
  get(cx,cz,localKey){const e=this.data.edits[`${cx},${cz}`]; return e && Object.prototype.hasOwnProperty.call(e,localKey)?e[localKey]:undefined;}
  set(cx,cz,localKey,id,original){const e=this.chunkEdits(cx,cz); if(id===original) delete e[localKey]; else e[localKey]=id; if(Object.keys(e).length===0) delete this.data.edits[`${cx},${cz}`]; this.scheduleSave();}
}

class Chunk {
  constructor(cx,cz){this.cx=cx;this.cz=cz;this.data=new Uint8Array(CHUNK*WORLD_HEIGHT*CHUNK);this.opaque=null;this.water=null;this.dirty=true;this.generated=false;this.lastUsed=performance.now();}
  index(x,y,z){return x + CHUNK*(z + CHUNK*y)}
  get(x,y,z){if(x<0||x>=CHUNK||y<0||y>=WORLD_HEIGHT||z<0||z>=CHUNK)return 0;return this.data[this.index(x,y,z)]}
  set(x,y,z,id){if(x<0||x>=CHUNK||y<0||y>=WORLD_HEIGHT||z<0||z>=CHUNK)return;this.data[this.index(x,y,z)]=id;this.dirty=true;}
}

class World {
  constructor(scene){this.scene=scene; this.persistence=new Persistence(); const d=this.persistence.load(); this.seed=d.seed; this.gen=new TerraWorldGenerator(this.seed); this.chunks=new Map(); this.pending=new Set(); this.totalGenerated=0;}
  key(cx,cz){return `${cx},${cz}`}
  coords(x,z){return {cx:Math.floor(x/CHUNK),cz:Math.floor(z/CHUNK),lx:((x%CHUNK)+CHUNK)%CHUNK,lz:((z%CHUNK)+CHUNK)%CHUNK}}
  originalBlock(x,y,z){
    const s=this.gen.structureBlockAt(x,y,z); return s!==null ? s : this.gen.blockAt(x,y,z);
  }
  getChunk(cx,cz,build=true){
    const k=this.key(cx,cz); let c=this.chunks.get(k); if(!c){c=new Chunk(cx,cz); this.gen.generateChunk(cx,cz,c.data); this.applyEdits(c); c.generated=true; this.chunks.set(k,c); this.totalGenerated++;}
    c.lastUsed=performance.now(); if(build && c.dirty) this.rebuildChunk(c); return c;
  }
  applyEdits(c){const edits=this.persistence.data.edits[this.key(c.cx,c.cz)]; if(!edits)return; for(const key in edits){const [x,y,z]=key.split('.').map(Number); if(x>=0&&x<CHUNK&&y>=0&&y<WORLD_HEIGHT&&z>=0&&z<CHUNK)c.data[c.index(x,y,z)]=edits[key];}}
  getBlock(x,y,z,load=true){const cpos=this.coords(x,z), c=this.getChunk(cpos.cx,cpos.cz,load); return c.get(cpos.lx,y,cpos.lz);}
  setBlock(x,y,z,id){if(y<0||y>=WORLD_HEIGHT)return false; const p=this.coords(x,z),c=this.getChunk(p.cx,p.cz,true); const old=c.get(p.lx,y,p.lz); if(old===id)return false; c.set(p.lx,y,p.lz,id); const original=this.originalBlock(x,y,z); this.persistence.set(p.cx,p.cz,`${p.lx}.${y}.${p.lz}`,id,original); this.rebuildAffected(p.cx,p.cz,p.lx,p.lz); return true;}
  rebuildAffected(cx,cz,lx,lz){this.rebuildChunk(this.getChunk(cx,cz,false)); if(lx===0)this.rebuildChunk(this.getChunk(cx-1,cz,false)); if(lx===CHUNK-1)this.rebuildChunk(this.getChunk(cx+1,cz,false)); if(lz===0)this.rebuildChunk(this.getChunk(cx,cz-1,false)); if(lz===CHUNK-1)this.rebuildChunk(this.getChunk(cx,cz+1,false));}
  neighborBlock(cx,cz,lx,y,lz){let nx=cx,nz=cz,x=lx,z=lz;if(x<0){nx--;x=15;}else if(x>15){nx++;x=0;}if(z<0){nz--;z=15;}else if(z>15){nz++;z=0;}return this.getChunk(nx,nz,false).get(x,y,z);}
  rebuildChunk(c){
    const opaquePos=[],opaqueNorm=[],opaqueUV=[],opaqueIdx=[]; const waterPos=[],waterNorm=[],waterUV=[],waterIdx=[]; let oi=0,wi=0;
    const ox=c.cx*CHUNK,oz=c.cz*CHUNK;
    const pushFace=(P,N,U,I,off,x,y,z,nx,ny,nz,uv)=>{
      const verts=[
        [x,y,z],[x+nx,y,z],[x+nx,y+ny,z+nz],[x,y+ny,z+nz]
      ];
      // face basis derived from normal, robust for axis-aligned cube faces
      let a,b;
      if(Math.abs(nx)>0){a=[0,0,1];b=[0,1,0]; if(nx<0)a=[0,0,-1];}
      else if(Math.abs(ny)>0){a=[1,0,0];b=[0,0,nz>=0?1:-1];}
      else {a=[1,0,0];b=[0,1,0]; if(nz<0)a=[-1,0,0];}
      const faceVerts = (nx<0||ny<0||nz<0)?[verts[0],verts[3],verts[2],verts[1]]:verts;
      for(const v of faceVerts){P.push(v[0],v[1],v[2]);N.push(nx,ny,nz);}
      U.push(...uv);
      I.push(off,off+1,off+2,off,off+2,off+3);
    };
    const faceDefs=[
      {n:[0,1,0],d:[0,1,0],face:'top'}, {n:[0,-1,0],d:[0,-1,0],face:'bottom'},
      {n:[1,0,0],d:[1,0,0],face:'side'}, {n:[-1,0,0],d:[-1,0,0],face:'side'},
      {n:[0,0,1],d:[0,0,1],face:'side'}, {n:[0,0,-1],d:[0,0,-1],face:'side'}
    ];
    const pos=[]; const isIn=[0,0,0,0,0,0];
    for(let y=0;y<WORLD_HEIGHT;y++) for(let lz=0;lz<CHUNK;lz++) for(let lx=0;lx<CHUNK;lx++){
      const id=c.get(lx,y,lz); if(id===0)continue; const b=blocks[id]; if(!b)continue;
      const isWater=id===T.WATER;
      for(const f of faceDefs){const nx=f.d[0],ny=f.d[1],nz=f.d[2]; const neighbor=(lx+nx<0||lx+nx>=CHUNK||lz+nz<0||lz+nz>=CHUNK)?this.neighborBlock(c.cx,c.cz,lx+nx,y,lz+nz):c.get(lx+nx,y,lz+nz); const nb=blocks[neighbor]||blocks[0];
        let visible=false;
        if(isWater) visible = neighbor===0;
        else visible = neighbor===0 || neighbor===T.WATER || (nb && nb.transparent && neighbor!==id);
        if(!visible)continue;
        const uv=[]; texTile(b.tex,f.face,uv); const P=isWater?waterPos:opaquePos,N=isWater?waterNorm:opaqueNorm,U=isWater?waterUV:opaqueUV,I=isWater?waterIdx:opaqueIdx,off=isWater?wi:oi;
        pushFace(P,N,U,I,off,lx+ox,y,lz+oz,nx,ny,nz,uv); if(isWater)wi+=4;else oi+=4;
      }
    }
    const makeGeo=(P,N,U,I)=>{if(!P.length)return null;const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));g.setIndex(I);g.computeBoundingSphere();return g;};
    if(c.opaque){this.scene.remove(c.opaque);c.opaque.geometry.dispose();c.opaque=null;} if(c.water){this.scene.remove(c.water);c.water.geometry.dispose();c.water=null;}
    const og=makeGeo(opaquePos,opaqueNorm,opaqueUV,opaqueIdx); if(og){c.opaque=new THREE.Mesh(og,materials.opaque);c.opaque.frustumCulled=true;this.scene.add(c.opaque);}
    const wg=makeGeo(waterPos,waterNorm,waterUV,waterIdx); if(wg){c.water=new THREE.Mesh(wg,materials.water);c.water.frustumCulled=true;this.scene.add(c.water);}
    c.dirty=false;
  }
  updateAround(px,pz){const ccx=Math.floor(px/CHUNK),ccz=Math.floor(pz/CHUNK); const wanted=new Set(); for(let dz=-RENDER_DISTANCE;dz<=RENDER_DISTANCE;dz++)for(let dx=-RENDER_DISTANCE;dx<=RENDER_DISTANCE;dx++){if(dx*dx+dz*dz>RENDER_DISTANCE*RENDER_DISTANCE+1)continue;const cx=ccx+dx,cz=ccz+dz,k=this.key(cx,cz);wanted.add(k);this.getChunk(cx,cz,true);}
    for(const [k,c] of this.chunks){const dx=c.cx-ccx,dz=c.cz-ccz;if(dx*dx+dz*dz>(RENDER_DISTANCE+1)*(RENDER_DISTANCE+1)){if(c.opaque){this.scene.remove(c.opaque);c.opaque.geometry.dispose();c.opaque=null;}if(c.water){this.scene.remove(c.water);c.water.geometry.dispose();c.water=null;}this.chunks.delete(k);}}
  }
  findSafeSpawn(){
    for(let radius=0;radius<320;radius+=4){for(let i=0;i<24;i++){const ang=(i/24)*Math.PI*2+radius*0.11;const x=Math.floor(Math.cos(ang)*radius),z=Math.floor(Math.sin(ang)*radius);const s=this.gen.surfaceInfo(x,z);if(s.waterDepth>0||s.waterKind)continue; if(s.biome==='Mountains'||s.biome==='Snow Mountains')continue;if(s.surface<16||s.surface>38)continue;const y=s.surface+1;let clear=true;for(let yy=y;yy<=y+2;yy++)if(this.getBlock(x,yy,z,true)!==0)clear=false; if(!clear)continue;const around=[[x+1,z],[x-1,z],[x,z+1],[x,z-1]];if(around.some(p=>Math.abs(this.gen.surfaceInfo(p[0],p[1]).surface-s.surface)>2))continue; if(this.gen.structureAtCell(Math.floor(x/48),Math.floor(z/48)))continue; return {x:x+0.5,y:y,z:z+0.5};}}
    return {x:0,y:SEA_LEVEL+4,z:0};
  }
}

// ---------------- Rendering ----------------
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x86c5ef); scene.fog=new THREE.Fog(0x86c5ef,70,260);
const camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.05,420); camera.rotation.order='YXZ';
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);
const materials={
  opaque:new THREE.MeshLambertMaterial({map:atlas,side:THREE.FrontSide,alphaTest:0.45}),
  water:new THREE.MeshLambertMaterial({map:atlas,transparent:true,opacity:.62,depthWrite:false,side:THREE.DoubleSide})
};
const hemi=new THREE.HemisphereLight(0xc6e8ff,0x20241c,0.72);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff5d6,1.0);sun.position.set(40,80,20);scene.add(sun);

// ---------------- Day/night ----------------
const skyDay=new THREE.Color(0x86c5ef), skyNight=new THREE.Color(0x071022), fogDay=new THREE.Color(0x86c5ef), fogNight=new THREE.Color(0x0b1222);
const starGeo=new THREE.BufferGeometry(), starPos=[];for(let i=0;i<650;i++){const a=Math.random()*Math.PI*2,b=Math.acos(THREE.MathUtils.randFloatSpread(2));const r=360;starPos.push(Math.sin(b)*Math.cos(a)*r,Math.abs(Math.cos(b))*r*0.8+120,Math.sin(b)*Math.sin(a)*r);}starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));const stars=new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:1.2,sizeAttenuation:true,transparent:true,opacity:0}));scene.add(stars);
function updateDayNight(t){const day=(Math.sin(t*0.05-Math.PI/2)+1)/2;const sunHeight=Math.sin(t*0.05-Math.PI/2);scene.background.copy(skyNight).lerp(skyDay,day);scene.fog.color.copy(fogNight).lerp(fogDay,day);scene.fog.near=50;scene.fog.far=110+day*190;sun.position.set(Math.cos(t*0.05)*90,20+sunHeight*75,Math.sin(t*0.05)*90);sun.intensity=.18+day*1.05;hemi.intensity=.25+day*.65;stars.material.opacity=Math.max(0,1-day)*.9;}

// ---------------- World / player ----------------
const world=new World(scene); world.updateAround(0,0);
const spawn=world.findSafeSpawn();
const player={pos:new THREE.Vector3(spawn.x,spawn.y,spawn.z),vel:new THREE.Vector3(),yaw:0,pitch:0,onGround:false,sprinting:false};
camera.position.set(player.pos.x,player.pos.y+PLAYER.eye,player.pos.z);

function solidAt(x,y,z){const id=world.getBlock(x,y,z,true);return id!==0 && id!==T.WATER && blocks[id] && blocks[id].solid;}
function collides(px,py,pz){const minX=Math.floor(px-PLAYER.width/2),maxX=Math.floor(px+PLAYER.width/2),minY=Math.floor(py),maxY=Math.floor(py+PLAYER.height-0.001),minZ=Math.floor(pz-PLAYER.width/2),maxZ=Math.floor(pz+PLAYER.width/2);for(let y=minY;y<=maxY;y++)for(let z=minZ;z<=maxZ;z++)for(let x=minX;x<=maxX;x++)if(solidAt(x,y,z))return true;return false;}
function moveAxis(axis,amount){if(Math.abs(amount)<1e-6)return;const steps=Math.max(1,Math.ceil(Math.abs(amount)/0.18));const step=amount/steps;for(let i=0;i<steps;i++){const next=player.pos.clone();next[axis]+=step;if(!collides(next.x,next.y,next.z)){player.pos.copy(next);}else{if(axis==='y'){if(step<0)player.onGround=true;player.vel.y=0;}break;}}}
function physics(dt,input){const speed=player.sprinting?PLAYER.sprint:PLAYER.walk;const forward=new THREE.Vector3(Math.sin(player.yaw),0,Math.cos(player.yaw));const right=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));const wish=new THREE.Vector3();wish.addScaledVector(forward,input.forward);wish.addScaledVector(right,input.strafe);if(wish.lengthSq()>0)wish.normalize().multiplyScalar(speed);player.vel.x=THREE.MathUtils.damp(player.vel.x,wish.x,14,dt);player.vel.z=THREE.MathUtils.damp(player.vel.z,wish.z,14,dt);player.vel.y-=PLAYER.gravity*dt;if(input.jump&&player.onGround){player.vel.y=PLAYER.jump;player.onGround=false;}player.onGround=false;moveAxis('x',player.vel.x*dt);moveAxis('z',player.vel.z*dt);moveAxis('y',player.vel.y*dt);camera.position.set(player.pos.x,player.pos.y+PLAYER.eye,player.pos.z);camera.rotation.set(player.pitch,player.yaw,0,'YXZ');}

// ---------------- Inventory / drops ----------------
class Inventory {
  constructor(){this.slots=Array.from({length:36},()=>null);this.selected=0;}
  count(id){return this.slots.reduce((n,s)=>n+(s&&s.id===id?s.count:0),0);}
  add(id,count=1){const def=items[id];if(!def)return false;let left=count;for(const s of this.slots){if(!s||s.id!==id||s.count>=def.stack)continue;const take=Math.min(left,def.stack-s.count);s.count+=take;left-=take;if(!left)return true;}for(let i=0;i<this.slots.length&&left;i++){if(this.slots[i])continue;const take=Math.min(left,def.stack);this.slots[i]={id,count:take};left-=take;}return left===0;}
  remove(id,count=1){let left=count;for(let i=this.slots.length-1;i>=0&&left;i--){const s=this.slots[i];if(!s||s.id!==id)continue;const take=Math.min(left,s.count);s.count-=take;left-=take;if(s.count<=0)this.slots[i]=null;}return left===0;}
  selectedItem(){return this.slots[this.selected];}
}
const inv=new Inventory();inv.add('wood_pickaxe');inv.add('stone_pickaxe');inv.add('iron_pickaxe');inv.add('diamond_pickaxe');inv.add('dirt',32);inv.add('planks',32);inv.add('sand',24);inv.add('apple',8);inv.add('iron',5);
const dropMeshes=[];
function spawnDrop(id,pos){const def=items[id];if(!def)return;const mesh=new THREE.Mesh(new THREE.BoxGeometry(.24,.24,.24),new THREE.MeshLambertMaterial({color:def.color}));mesh.position.copy(pos);mesh.userData={item:id,t:Math.random()*6.2};scene.add(mesh);dropMeshes.push(mesh);}
function updateDrops(dt){for(let i=dropMeshes.length-1;i>=0;i--){const d=dropMeshes[i];d.userData.t+=dt;d.rotation.y+=dt*2.1;d.position.y += Math.sin(d.userData.t*2)*0.002; if(d.position.distanceTo(player.pos)<1.65){if(inv.add(d.userData.item,1)){scene.remove(d);d.geometry.dispose();d.material.dispose();dropMeshes.splice(i,1);refreshHotbar();}}}}

function tilePreview(item){const el=document.createElement('canvas');el.width=28;el.height=28;const ctx=el.getContext('2d');ctx.fillStyle='#'+(items[item]?.color??0x999999).toString(16).padStart(6,'0');ctx.fillRect(4,4,20,20);ctx.strokeStyle='rgba(255,255,255,.6)';ctx.strokeRect(4.5,4.5,19,19);return el;}
function refreshHotbar(){const h=document.getElementById('hotbar');h.innerHTML='';for(let i=0;i<9;i++){const d=document.createElement('div');d.className='slot'+(inv.selected===i?' selected':'');d.dataset.slot=i;const s=inv.slots[i];const key=document.createElement('span');key.className='key';key.textContent=i+1;d.append(key);if(s){d.append(tilePreview(s.id));const c=document.createElement('span');c.className='count';c.textContent=s.count>1?s.count:'';d.append(c);}d.onclick=()=>{inv.selected=i;refreshHotbar();};h.append(d);}}
function refreshInventory(){const g=document.getElementById('invGrid');g.innerHTML='';for(let i=0;i<36;i++){const d=document.createElement('div');d.className='slot';const s=inv.slots[i];if(s){d.append(tilePreview(s.id));const c=document.createElement('span');c.className='count';c.textContent=s.count>1?s.count:'';d.append(c);}d.onclick=()=>{if(i<9){inv.selected=i;refreshHotbar();}};g.append(d);}}
refreshHotbar();refreshInventory();

function craftBucket(){if(inv.count('iron')>=5){inv.remove('iron',5);inv.add('iron_bucket',1);refreshHotbar();refreshInventory();toast('Crafted 1 iron bucket from 5 iron');}else toast('Need 5 iron');}

// ---------------- Raycast target / interaction ----------------
const raycaster=new THREE.Raycaster();raycaster.far=7;
function aimRay(){camera.updateMatrixWorld();return new THREE.Ray(camera.getWorldPosition(new THREE.Vector3()),new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion).normalize());}
function voxelHit(mesh,hit){const p=hit.point.clone().addScaledVector(hit.face.normal,-1e-4);const x=Math.floor(p.x),y=Math.floor(p.y),z=Math.floor(p.z);return {x,y,z,point:hit.point.clone(),normal:hit.face.normal.clone(),distance:hit.distance};}
function getTarget(){const ray=aimRay();const origins=[];world.chunks.forEach(c=>{if(c.opaque)origins.push(c.opaque);});const hitsSolid=raycaster.intersectObjects(origins,false).filter(h=>h.distance<=7);let solidHit=hitsSolid[0]?voxelHit(origins.find(m=>m===hitsSolid[0].object),hitsSolid[0]):null;
  const waterMeshes=[];world.chunks.forEach(c=>{if(c.water)waterMeshes.push(c.water)});const hitsWater=raycaster.intersectObjects(waterMeshes,false).filter(h=>h.distance<=7);let waterHit=hitsWater[0]?voxelHit(hitsWater[0].object,hitsWater[0]):null;
  if(solidHit)return {kind:'block',...solidHit,block:world.getBlock(solidHit.x,solidHit.y,solidHit.z,true)};
  if(waterHit)return {kind:'water',...waterHit,block:T.WATER};
  return {kind:'empty'};
}
function hasMobTarget(){return false;} // combat-ready interaction layer; mobs intentionally absent

let mining={active:false,x:0,y:0,z:0,progress:0};
function getToolStats(){const s=inv.selectedItem();if(!s)return {tier:0,type:'hand'};const d=items[s.id]||{};return {tier:d.toolTier||0,type:d.toolType||'hand'};}
function miningTime(block){const tool=getToolStats();if(!block||!block.mineable)return Infinity;if(tool.tier<block.requiredToolTier)return Infinity;let speed=1;if(tool.type==='pickaxe'&&block.id===T.STONE)speed=3;if(tool.type==='pickaxe'&&(block.id===T.IRON_ORE||block.id===T.COBBLESTONE))speed=2.4;if(tool.type==='pickaxe'&&block.id===T.DIAMOND_ORE)speed=2.2;const penalty=(block.id===T.GRASS||block.id===T.SNOW||block.id===T.SAND)?1:0.7;return block.hardness*penalty/speed;}
function tickMining(dt){if(!mining.active){mining.progress=0;return;}const t=getTarget();if(t.kind!=='block'||t.x!==mining.x||t.y!==mining.y||t.z!==mining.z){mining.active=false;mining.progress=0;return;}const b=blocks[t.block];const total=miningTime(b);if(!isFinite(total)){mining.active=false;mining.progress=0;return;}mining.progress+=dt;if(mining.progress>=total){const oldId=t.block;const drop=blocks[oldId].drops;if(world.setBlock(t.x,t.y,t.z,0)&&drop)spawnDrop(drop,new THREE.Vector3(t.x+.5,t.y+.6,t.z+.5));mining.active=false;mining.progress=0;}
}
function primaryActionStart(){const t=getTarget();if(t.kind==='block'){if(!blocks[t.block]?.mineable)return;mining.active=true;mining.x=t.x;mining.y=t.y;mining.z=t.z;mining.progress=0;return;}if(t.kind==='empty')useSelectedFood();}
function startMine(){primaryActionStart();}
function stopMine(){mining.active=false;mining.progress=0;}
function placeSelected(){const item=inv.selectedItem();const def=item&&items[item.id];if(!def||!def.place)return false;const t=getTarget();if(!t|| (t.kind!=='block'&&t.kind!=='water'))return false;const dest={x:t.x+Math.round(t.normal.x),y:t.y+Math.round(t.normal.y),z:t.z+Math.round(t.normal.z)};if(dest.y<1||dest.y>=WORLD_HEIGHT)return false;const existing=world.getBlock(dest.x,dest.y,dest.z,true);if(existing!==0&&existing!==T.WATER)return false;const oldPlayerBox={x:player.pos.x,y:player.pos.y,z:player.pos.z};const placed=world.setBlock(dest.x,dest.y,dest.z,def.place);if(!placed)return false;if(collides(oldPlayerBox.x,oldPlayerBox.y,oldPlayerBox.z)){world.setBlock(dest.x,dest.y,dest.z,existing);return false;}item.count--;if(item.count<=0)inv.slots[inv.selected]=null;refreshHotbar();return true;}
function bucketUse(){const s=inv.selectedItem();if(!s)return false;const t=getTarget();if(s.id==='iron_bucket'&&t.kind==='water'){if(world.setBlock(t.x,t.y,t.z,0)){s.id='water_bucket';refreshHotbar();return true;}}
  if(s.id==='water_bucket'&&t.kind==='block'){const d={x:t.x+Math.round(t.normal.x),y:t.y+Math.round(t.normal.y),z:t.z+Math.round(t.normal.z)};if(d.y<1||d.y>=WORLD_HEIGHT)return false;if(world.getBlock(d.x,d.y,d.z,true)!==0)return false;world.setBlock(d.x,d.y,d.z,T.WATER);if(!collides(player.pos.x,player.pos.y,player.pos.z)){s.id='iron_bucket';refreshHotbar();return true;}world.setBlock(d.x,d.y,d.z,0);}
  return false;}
function useSelectedFood(){const s=inv.selectedItem();if(!s||!items[s.id]?.food)return false;const t=getTarget();if(t.kind!=='empty')return false;s.count--;if(s.count<=0)inv.slots[inv.selected]=null;refreshHotbar();toast('Ate 1 '+items[s.id].name);return true;}
function attackAction(){const t=getTarget();if(t.kind==='block'||t.kind==='water')return; if(hasMobTarget()){} }

// ---------------- Inputs ----------------
const input={forward:0,strafe:0,jump:false};const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')input.jump=true;if(e.code.startsWith('Digit')){const n=+e.code.slice(5);if(n>=1&&n<=9){inv.selected=n-1;refreshHotbar();}}if(e.code==='KeyE')toggleInventory();});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Space')input.jump=false;});
let locked=false,mouseDown=false;
renderer.domElement.addEventListener('click',()=>{if(matchMedia('(pointer:fine)').matches&&!locked)renderer.domElement.requestPointerLock();});
document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);
document.addEventListener('mousemove',e=>{if(!locked)return;player.yaw-=e.movementX*0.0025;player.pitch-=e.movementY*0.0025;player.pitch=THREE.MathUtils.clamp(player.pitch,-Math.PI/2.05,Math.PI/2.05);});
renderer.domElement.addEventListener('mousedown',e=>{if(e.button===0){mouseDown=true;startMine();}if(e.button===2){e.preventDefault();placeSelected()}});
addEventListener('mouseup',e=>{if(e.button===0){mouseDown=false;stopMine();}});
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());

// Mobile: one joystick + inventory + sprint. Screen itself is the interaction surface.
const joy=document.getElementById('joystick'),stick=document.getElementById('stick');let joyId=null;function setJoy(ev){const r=joy.getBoundingClientRect();let dx=ev.clientX-(r.left+r.width/2),dy=ev.clientY-(r.top+r.height/2);const m=48;const len=Math.hypot(dx,dy);if(len>m){dx*=m/len;dy*=m/len;}stick.style.transform=`translate(${dx}px,${dy}px)`;input.strafe=dx/m;input.forward=-dy/m;}
joy.addEventListener('pointerdown',e=>{joyId=e.pointerId;joy.setPointerCapture(joyId);setJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)setJoy(e)});joy.addEventListener('pointerup',e=>{if(e.pointerId===joyId){joyId=null;stick.style.transform='translate(0,0)';input.strafe=0;input.forward=0;}});joy.addEventListener('pointercancel',e=>{joyId=null;stick.style.transform='translate(0,0)';input.strafe=0;input.forward=0;});
let touchHold=null,lastTap=0;
renderer.domElement.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const t=e.touches[0];if(t.clientX<150&&t.clientY>innerHeight-160)return;const now=performance.now();if(now-lastTap<340){placeSelected();lastTap=0;return;}lastTap=now;touchHold=setTimeout(()=>{const target=getTarget();if(target.kind==='empty')useSelectedFood();else startMine();},260);},{passive:false});
renderer.domElement.addEventListener('touchend',()=>{if(touchHold){clearTimeout(touchHold);touchHold=null;}stopMine();});

document.getElementById('inventoryBtn').onclick=toggleInventory;document.getElementById('closeInv').onclick=toggleInventory;document.getElementById('craftBucket').onclick=craftBucket;document.getElementById('sprintBtn').onclick=()=>{player.sprinting=!player.sprinting;document.getElementById('sprintBtn').style.background=player.sprinting?'rgba(48,128,100,.7)':'rgba(0,0,0,.38)'};
function toggleInventory(){const el=document.getElementById('inventory');const show=el.style.display!=='flex';el.style.display=show?'flex':'none';refreshInventory();if(show)stopMine();}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.opacity='0',1600);}

// ---------------- Main loop / diagnostics ----------------
let last=performance.now(),elapsed=0,frameCount=0;
function update(){const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;elapsed+=dt;frameCount++;
  if(matchMedia('(pointer:fine)').matches){input.forward=(keys.KeyW?1:0)-(keys.KeyS?1:0);input.strafe=(keys.KeyD?1:0)-(keys.KeyA?1:0);player.sprinting=!!keys.ShiftLeft||!!keys.ShiftRight;}
  if(!mouseDown&&locked)stopMine();
  physics(dt,input); tickMining(dt); updateDrops(dt); updateDayNight(elapsed); world.updateAround(player.pos.x,player.pos.z);
  document.getElementById('status').textContent=`Seed ${world.seed} • Chunks ${world.chunks.size} • ${blocks[world.getBlock(Math.floor(player.pos.x),Math.floor(player.pos.y),Math.floor(player.pos.z),true)]?.name||'Air'}`;
  renderer.render(scene,camera);requestAnimationFrame(update);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// ---------------- Runtime assertions / self-tests ----------------
function devTests(){
  const report={determinism:true,multipleSeeds:true,biomes:true,waterVoxel:true,boundaryMesh:true,miningRegistry:true,bucketRecipe:true,persistence:true,spawn:true,physics:true};
  try{
    const g1=new TerraWorldGenerator(world.seed),g2=new TerraWorldGenerator(world.seed);for(const p of [[3,19,4],[-77,24,130],[201,8,-49]]) if(g1.blockAt(...p)!==g2.blockAt(...p))report.determinism=false;
    const gA=new TerraWorldGenerator(world.seed+1),gB=new TerraWorldGenerator(world.seed+2); report.multipleSeeds=([[23,20,41],[-51,18,77],[180,14,-90]]).some(p=>gA.blockAt(...p)!==gB.blockAt(...p)) || gA.surfaceInfo(23,41).biome!==gB.surfaceInfo(23,41).biome;
    const foundBiomes=new Set(); for(let z=-1200;z<=1200;z+=80) for(let x=-1200;x<=1200;x+=80) foundBiomes.add(g1.biomeAt(x,z)); report.biomes=['Plains','Forest','Dense Forest','Taiga','Snowy Plains','Mountains','Snow Mountains','Swamp','Oceans'].every(b=>foundBiomes.has(b));
    report.waterVoxel=blocks[T.WATER].solid===false&&blocks[T.WATER].mineable===false&&materials.water.transparent===true&&materials.water.depthWrite===false;
    report.boundaryMesh=typeof world.rebuildAffected==='function';
    const specs={grass:['grass',0],wood:['wood',0],planks:['planks',0],crafting:['crafting_table',0],snow:['snow',0],sand:['sand',0],gravel:['gravel',0],stone:['cobblestone',1],iron:['iron_ore',1],diamond:['diamond',3],bedrock:[null,99]};
    report.miningRegistry=Object.values(specs).every(([drop,tier])=>drop===null?blocks[T.BEDROCK].mineable===false:blocks[Object.keys(blocks).find(k=>blocks[k].drops===drop)]?.requiredToolTier===tier);
    report.bucketRecipe=recipes[0].inputs.iron===5&&recipes[0].output==='iron_bucket';
    const s=world.findSafeSpawn();report.spawn=!collides(s.x,s.y,s.z)&&world.getBlock(Math.floor(s.x),Math.floor(s.y),Math.floor(s.z),true)!==T.WATER;
  }catch(e){report.error=String(e)}
  console.info('Terra static/runtime self-tests',report);
  toast('Terra initialized • diagnostics in console');
}
window.terra={world,player,inv,blocks,materials,devTests};
devTests();
update();
})();
